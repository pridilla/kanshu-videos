    <rect x="190" y="730" width="25" height="20" rx="4" fill="#0F172A"/>
    
    <!-- Cute Samurai Cat Riding -->
    <!-- Cat Body -->
    <ellipse cx="380" cy="360" rx="90" ry="80" fill="#FFFFFF"/>
