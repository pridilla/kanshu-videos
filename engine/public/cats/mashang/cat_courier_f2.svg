    <path d="M 120 700 Q 180 640 250 700 Q 320 640 400 700 Q 480 640 560 700 Q 640 640 720 700" stroke-width="12" opacity="0.7"/>
    
    <!-- Royal Horse -->
    <!-- Tail -->
