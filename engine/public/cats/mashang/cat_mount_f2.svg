<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <g stroke="#0F172A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Big Glowing UP Arrow (Ideograph 上) -->
    <polygon points="400,115 340,185 380,185 380,275 420,275 420,185 460,185" fill="#FF6F59" stroke="#FF6F59" stroke-width="8"/>
    
    <!-- Horizontal Saddle Stirrup Baseline (The line in 上) -->
    <line x1="150" y1="620" x2="650" y2="620" stroke="#0F172A" stroke-width="18"/>
    <rect x="220" y="620" width="80" height="15" fill="#0F172A"/>
    <rect x="500" y="620" width="80" height="15" fill="#0F172A"/>
    
    <!-- Cat Reaching & Climbing UPWARD -->
    <ellipse cx="400" cy="495" rx="100" ry="90" fill="#FFFFFF"/>
    <ellipse cx="400" cy="355" rx="85" ry="75" fill="#FFFFFF"/>
    <!-- Ears -->
    <path d="M 335 295 L 320 225 L 375 275 Z" fill="#FFFFFF"/>
    <path d="M 465 295 L 480 225 L 425 275 Z" fill="#FFFFFF"/>
    <!-- Determined Face -->
    <ellipse cx="365" cy="355" rx="10" ry="12" fill="#0F172A"/>
    <ellipse cx="435" cy="355" rx="10" ry="12" fill="#0F172A"/>
    <polygon points="395,370 405,370 400,377" fill="#0F172A"/>
    <path d="M 385 385 Q 400 400 415 385" stroke-width="6"/>
    
    <!-- Paws Gripping and Climbing UP -->
    <path d="M 320 415 L 300 325"/>
    <circle cx="300" cy="315" r="20" fill="#FFFFFF"/>
    <path d="M 480 415 L 500 325"/>
    <circle cx="500" cy="315" r="20" fill="#FFFFFF"/>
    
    <!-- Cat Feet on Baseline -->
    <ellipse cx="340" cy="588" rx="25" ry="18" fill="#FFFFFF"/>
    <ellipse cx="460" cy="588" rx="25" ry="18" fill="#FFFFFF"/>
  </g>
</svg>